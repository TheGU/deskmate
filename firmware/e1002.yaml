# ESPHome configuration for Seeed reTerminal E1002 as a thin display client
# for dashboard-hub. No business logic lives here: the device downloads
# ready-made 800x480 PNGs from the hub and shows them.
#
# Hardware facts verified against Seeed's wiki (E10xx ESPHome cookbooks,
# checked 2026-09-04) and the ESPHome epaper_spi model table:
#   display  epaper_spi model Seeed-reTerminal-E1002 (Spectra E6 7.3in,
#            cs 10, dc 11, reset 12, busy 13 inverted, SPI clk 7 mosi 9)
#   buttons  GPIO5 left white, GPIO4 right white, GPIO3 green (all active low)
#   buzzer   GPIO45          led GPIO6 (inverted)
#   battery  ADC GPIO1 (x2 divider), enable GPIO21
#   i2c      SDA 19, SCL 20: SHT4x temperature/humidity, PCF85063 RTC
#
# Button behaviour (proposal):
#   left white   previous page       right white  next page
#   green short  refresh current     green long   back to Today
# Navigation wraps. One press causes at most one panel refresh, and only
# after the PNG download succeeded. On failure the old image stays.

substitutions:
  name: reterminal-e1002
  friendly_name: reTerminal E1002
  hub_base_url: !secret hub_base_url        # e.g. http://192.168.1.50:8080
  page_count: "5"                           # today agenda weather brief system
  auto_refresh_interval: 30min              # conditional request, 304 means no panel refresh
  alert_default_seconds: "90"
  telemetry_interval: 5min                  # POST sensors to the hub

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 600
      then:
        - output.turn_on: bsp_battery_enable
    - priority: -100          # after every component is set up
      then:
        - pcf85063.read_time: rtc_time

esp32:
  variant: esp32s3
  # The chip has 32MB, but ESP-IDF needs an experimental flag to use
  # 32MB with OTA. A 16MB layout gives ample app/OTA space with no flags.
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false   # the 768 KB image buffer needs PSRAM; fail loudly

logger:
  level: DEBUG
  # The E1002 exposes UART0 through its CH340 bridge. ESPHome's ESP32-S3
  # default (USB_SERIAL_JTAG) would send logs to a port that is not wired.
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key
  # The hub is the brain; Home Assistant is optional. Never reboot just
  # because no API client is connected.
  reboot_timeout: 0s
  actions:
    - action: show_alert
      variables:
        duration: int
        beep: bool
      then:
        - script.execute:
            id: show_alert
            duration: !lambda "return duration;"
            beep: !lambda "return beep;"
    - action: show_page
      variables:
        page: int
      then:
        - script.execute:
            id: goto_page
            page: !lambda "return page;"
            bust_cache: false
    - action: refresh_page
      then:
        - script.execute:
            id: load_current_page
            bust_cache: true
            force_display: true

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none            # USB powered, we want quick alerts
  on_connect:
    - script.execute:
        id: load_current_page
        bust_cache: false
        force_display: false
    - script.execute: report_telemetry
  ap:
    ssid: "reTerminal-E1002 Setup"
    password: !secret ap_password

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Bangkok
    on_time_sync:
      - pcf85063.write_time:
          id: rtc_time
  - platform: pcf85063
    id: rtc_time
    address: 0x51
    # Read once at boot (on_boot above). Polling would overwrite the SNTP
    # epoch with the drifting RTC value every 15 minutes.
    update_interval: never

globals:
  - id: current_url
    type: std::string
    restore_value: false
  - id: page_index
    type: int
    restore_value: true
    initial_value: "0"
  - id: saved_page_index
    type: int
    restore_value: false
    initial_value: "0"
  - id: alert_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: force_display_update
    type: bool
    restore_value: false
    initial_value: "false"

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

i2c:
  sda: GPIO19
  scl: GPIO20

http_request:
  timeout: 20s
  watchdog_timeout: 30s

image:
  - platform: online_image
    id: dashboard_image
    url: ${hub_base_url}/display/today.png
    format: PNG
    type: RGB565
    buffer_size: 65536
    update_interval: never
    on_download_finished:
      - if:
          condition:
            lambda: "return !cached || id(force_display_update);"
          then:
            - lambda: "id(force_display_update) = false;"
            - logger.log:
                level: INFO
                format: "Image changed, queueing panel refresh"
            - script.execute: refresh_panel
          else:
            - logger.log:
                level: INFO
                format: "Image unchanged (304), panel refresh skipped"
    on_error:
      - lambda: "id(force_display_update) = false;"
      - logger.log:
          level: WARN
          format: "Image download failed, keeping current screen"
      - rtttl.stop
      - rtttl.play: "err:d=8,o=4,b=140:c"

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      it.image(0, 0, id(dashboard_image));

script:
  # The epaper_spi driver drops update() unless its state machine is IDLE,
  # and a full Spectra 6 cycle (refresh, power off, deep sleep) takes 30 to
  # 40 s. Component::is_idle() is true exactly when that machine is IDLE
  # (the driver disables its loop in IDLE and re-enables it on update), so
  # wait for it instead of losing the refresh. mode: restart means a newer
  # image simply replaces a still-queued refresh.
  - id: refresh_panel
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: "return id(epaper_display)->is_idle();"
          timeout: 120s
      - logger.log:
          level: INFO
          format: "Panel idle, refreshing"
      - component.update: epaper_display

  # Push onboard sensor readings to the hub. The hub stores them and draws
  # the desk panel and the 24 h climate chart; the device keeps no history.
  - id: report_telemetry
    mode: single
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.post:
                url: ${hub_base_url}/api/device/telemetry
                request_headers:
                  Content-Type: application/json
                body: !lambda |-
                  static const char *const PAGES[] = {"today", "agenda", "weather", "brief", "system"};
                  auto num = [](float v, int decimals) -> std::string {
                    if (std::isnan(v)) return "null";
                    char b[24];
                    snprintf(b, sizeof(b), "%.*f", decimals, v);
                    return b;
                  };
                  int idx = id(page_index);
                  if (idx < 0 || idx >= ${page_count}) idx = 0;
                  std::string body = "{";
                  body += "\"device\":\"${name}\"";
                  body += ",\"battery_voltage\":" + num(id(battery_voltage).state, 3);
                  body += ",\"battery_level\":" + num(id(battery_level).state, 1);
                  body += ",\"temperature\":" + num(id(temp_sensor).state, 2);
                  body += ",\"humidity\":" + num(id(hum_sensor).state, 1);
                  body += ",\"wifi_rssi\":" + num(id(wifi_rssi).state, 0);
                  body += ",\"uptime_s\":" + num(id(uptime_s).state, 0);
                  body += std::string(",\"page\":\"") + (id(alert_active) ? "alert" : PAGES[idx]) + "\"";
                  body += "}";
                  return body;
                capture_response: false
                on_error:
                  - logger.log:
                      level: WARN
                      format: "Telemetry POST failed"

  # Request the PNG for the current page. bust_cache adds a query string so
  # the hub re-renders instead of serving its cache. force_display makes the
  # panel refresh even when the hub answers 304.
  - id: load_current_page
    mode: restart
    parameters:
      bust_cache: bool
      force_display: bool
    then:
      # A second press must not be swallowed by an in-flight download:
      # OnlineImage::update() silently returns while decoding.
      - if:
          condition:
            lambda: "return id(dashboard_image)->is_decoding();"
          then:
            - online_image.release: dashboard_image
      - lambda: |-
          id(force_display_update) = force_display;
          static const char *const PAGES[] = {"today", "agenda", "weather", "brief", "system"};
          int idx = id(page_index);
          if (idx < 0 || idx >= ${page_count}) idx = 0;
          std::string url = std::string("${hub_base_url}/display/") + PAGES[idx] + ".png";
          if (bust_cache) url += "?t=" + std::to_string(millis());
          // set_url() unconditionally clears the ETag, so only call it when the
          // URL really changed. Same URL keeps the ETag and lets the hub answer 304.
          if (url != id(current_url)) {
            id(current_url) = url;
            id(dashboard_image)->set_url(url);
          }
      - component.update: dashboard_image

  - id: goto_page
    mode: restart
    parameters:
      page: int
      bust_cache: bool
    then:
      - lambda: |-
          int count = ${page_count};
          id(page_index) = ((page % count) + count) % count;
      - script.execute:
          id: load_current_page
          bust_cache: !lambda "return bust_cache;"
          force_display: true

  # Full-screen alert: beep, show /display/alert.png, restore previous page
  # after `duration` seconds (0 means the default).
  - id: show_alert
    mode: restart
    parameters:
      duration: int
      beep: bool
    then:
      - lambda: |-
          if (!id(alert_active)) {
            id(saved_page_index) = id(page_index);
            id(alert_active) = true;
          }
          id(force_display_update) = true;
      - if:
          condition:
            lambda: "return beep;"
          then:
            - rtttl.stop
            - rtttl.play: "alert:d=8,o=6,b=180:e,p,e,p,e"
      - if:
          condition:
            lambda: "return id(dashboard_image)->is_decoding();"
          then:
            - online_image.release: dashboard_image
      - lambda: |-
          id(current_url) = std::string("${hub_base_url}/display/alert.png?t=") + std::to_string(millis());
          id(dashboard_image)->set_url(id(current_url));
      - component.update: dashboard_image
      - delay: !lambda "return (duration > 0 ? duration : ${alert_default_seconds}) * 1000;"
      - lambda: |-
          id(alert_active) = false;
          id(page_index) = id(saved_page_index);
      - script.execute:
          id: load_current_page
          bust_cache: false
          force_display: true

interval:
  - interval: ${telemetry_interval}
    then:
      - script.execute: report_telemetry
  - interval: ${auto_refresh_interval}
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: "return !id(alert_active);"
          then:
            - script.execute:
                id: load_current_page
                bust_cache: false
                force_display: false

binary_sensor:
  - platform: gpio
    id: button_left
    name: "Left button"
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      # The tact switches open briefly (under 100 ms) shortly after a press,
      # which made the release-edge click triggers fire while still held.
      - delayed_on: 50ms
      - delayed_off: 250ms
    on_press:
      - if:
          condition:
            lambda: "return !id(alert_active);"
          then:
            - script.execute:
                id: goto_page
                page: !lambda "return id(page_index) - 1;"
                bust_cache: false

  - platform: gpio
    id: button_right
    name: "Right button"
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    filters:
      # The tact switches open briefly (under 100 ms) shortly after a press,
      # which made the release-edge click triggers fire while still held.
      - delayed_on: 50ms
      - delayed_off: 250ms
    on_press:
      - if:
          condition:
            lambda: "return !id(alert_active);"
          then:
            - script.execute:
                id: goto_page
                page: !lambda "return id(page_index) + 1;"
                bust_cache: false

  - platform: gpio
    id: button_green
    name: "Green button"
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    filters:
      # The tact switches open briefly (under 100 ms) shortly after a press,
      # which made the release-edge click triggers fire while still held.
      - delayed_on: 50ms
      - delayed_off: 250ms
    on_click:
      # short press: refresh current page with a fresh render
      # Filters shift the measured length by about +200 ms; ranges stay
      # contiguous so no press length is a dead zone.
      - min_length: 30ms
        max_length: 800ms
        then:
          - rtttl.stop
          - rtttl.play: "click:d=32,o=6,b=200:c"
          - if:
              condition:
                lambda: "return id(alert_active);"
              then:
                # dismiss the alert early
                - script.stop: show_alert
                - lambda: |-
                    id(alert_active) = false;
                    id(page_index) = id(saved_page_index);
                - script.execute:
                    id: load_current_page
                    bust_cache: false
                    force_display: true
              else:
                - script.execute:
                    id: load_current_page
                    bust_cache: true
                    force_display: true
      # long press: back to Today
      - min_length: 801ms
        max_length: 60s     # default max is 350ms; any realistic hold still counts
        then:
          - rtttl.stop
          - rtttl.play: "home:d=16,o=6,b=200:c,e"
          - script.stop: show_alert
          - lambda: "id(alert_active) = false;"
          - script.execute:
              id: goto_page
              page: 0
              bust_cache: true

output:
  - platform: ledc
    id: buzzer_output
    pin: GPIO45
    frequency: 1000Hz
  - platform: gpio
    id: bsp_led
    pin: GPIO6
    inverted: true
  - platform: gpio
    id: bsp_battery_enable
    pin: GPIO21

rtttl:
  id: buzzer
  output: buzzer_output
  gain: 60%

light:
  - platform: binary
    id: onboard_led
    name: "Onboard LED"
    output: bsp_led

sensor:
  - platform: sht4x
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Humidity"
      id: hum_sensor
    update_interval: 60s
  - platform: adc
    id: battery_voltage
    name: "Battery voltage"
    pin: GPIO1
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0
  - platform: template
    id: battery_level
    name: "Battery level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    update_interval: 60s
    lambda: "return id(battery_voltage).state;"
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi signal"
    update_interval: 60s
  - platform: uptime
    id: uptime_s
    name: "Uptime"

text_sensor:
  - platform: template
    id: current_page
    name: "Current page"
    lambda: |-
      static const char *const PAGES[] = {"today", "agenda", "weather", "brief", "system"};
      if (id(alert_active)) return std::string("alert");
      int idx = id(page_index);
      if (idx < 0 || idx >= ${page_count}) idx = 0;
      return std::string(PAGES[idx]);
    update_interval: 60s

button:
  - platform: restart
    name: "Restart"
