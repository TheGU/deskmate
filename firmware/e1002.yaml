# ESPHome configuration for Seeed reTerminal E1002 as a thin display client
# for dashboard-hub. No business logic lives here: the device downloads
# ready-made 800x480 PNGs from the hub and shows them.
#
# Hardware facts verified against Seeed's wiki (E10xx ESPHome cookbooks,
# checked 2026-09-04) and the ESPHome epaper_spi model table:
#   display  epaper_spi model Seeed-reTerminal-E1002 (Spectra E6 7.3in,
#            cs 10, dc 11, reset 12, busy 13 inverted, SPI clk 7 mosi 9)
#   buttons  GPIO5 left white, GPIO4 right white, GPIO3 green (all active low)
#   buzzer   GPIO45          led GPIO6 (inverted)
#   battery  ADC GPIO1 (x2 divider), enable GPIO21
#   i2c      SDA 19, SCL 20: SHT4x temperature/humidity, PCF85063 RTC
#
# Button behaviour (proposal):
#   left white   previous page       right white  next page
#   green short  refresh current     green long   back to Today
# Navigation wraps. One press causes at most one panel refresh, and only
# after the PNG download succeeded. On failure the old image stays.

substitutions:
  name: reterminal-e1002
  friendly_name: reTerminal E1002
  # hub_base_url and hub_key are runtime text components (below), not
  # substitutions: rotating a key or moving the hub is a browser edit, not
  # a reflash. secrets.yaml still supplies their first-boot seed value.
  # page_count and page_names (globals, below) are likewise runtime state,
  # not substitutions: the device starts with a default count of 5 and no
  # known ids, then learns both from every telemetry response.
  auto_refresh_interval: 30min              # conditional request, 304 means no panel refresh
  alert_default_seconds: "90"
  telemetry_interval: 5min                  # POST sensors to the hub
  # Battery mode: wake at these local hours (ascending), refresh, sleep.
  wake_hours: "8, 12, 17"
  battery_awake_grace: 45s                  # stay awake this long after the refresh
  battery_awake_deadline: 150s              # sleep no matter what after this

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - deskmate_sleep.h
    - deskmate_charger.h
    - deskmate_pages.h
  on_boot:
    - priority: 900           # before the gpio binary_sensors (HARDWARE = 800)
      then:
        - lambda: "deskmate::release_sleep_pads();"
    - priority: 600
      then:
        - output.turn_on: bsp_battery_enable
    - priority: -100          # after every component is set up
      then:
        # page_count and page_index are both restore_value: true and are
        # restored before on_boot runs, so clamp here in case the enabled
        # page count shrank since the last time this device was on.
        - lambda: |-
            if (id(page_count) < 1) id(page_count) = 1;
            if (id(page_count) > 32) id(page_count) = 32;
            int count = id(page_count);
            id(page_index) = ((id(page_index) % count) + count) % count;
        - pcf85063.read_time: rtc_time
        # Decide the power mode first: a battery wake that finds USB plugged
        # in switches back to always-on before any sleep timer is armed.
        - script.execute: check_power
        - if:
            condition:
              lambda: "return id(battery_mode);"
            then:
              - logger.log:
                  level: INFO
                  format: "Battery mode: awake, will sleep after the refresh"
              - script.execute: battery_deadline

esp32:
  variant: esp32s3
  # The chip has 32MB, but ESP-IDF needs an experimental flag to use
  # 32MB with OTA. A 16MB layout gives ample app/OTA space with no flags.
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false   # the 768 KB image buffer needs PSRAM; fail loudly

logger:
  level: DEBUG
  # The E1002 exposes UART0 through its CH340 bridge. ESPHome's ESP32-S3
  # default (USB_SERIAL_JTAG) would send logs to a port that is not wired.
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key
  # The hub is the brain; Home Assistant is optional. Never reboot just
  # because no API client is connected.
  reboot_timeout: 0s
  actions:
    - action: show_alert
      variables:
        duration: int
        beep: bool
      then:
        - script.execute:
            id: show_alert
            duration: !lambda "return duration;"
            beep: !lambda "return beep;"
    - action: show_page
      variables:
        page: int
      then:
        - script.execute:
            id: goto_page
            page: !lambda "return page;"
            bust_cache: false
    - action: refresh_page
      then:
        - script.execute:
            id: load_current_page
            bust_cache: true
            force_display: true

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      - script.stop: sleep_timer
      - script.stop: battery_deadline

wifi:
  # No ssid/password: ESPHome secrets cannot be left empty per key (tried
  # empty strings against ESPHome 2026.8.2's `esphome config`: rejected
  # with "SSID can't be empty"). wifi: may omit both entirely when ap: is
  # set, confirmed the same way, so Wi-Fi is provisioned only at runtime:
  # the captive portal AP below or Improv over serial (docs/FLASHING.md,
  # "Provisioning at runtime"). Credentials entered either way are saved
  # to NVS by ESPHome's save_wifi_sta and survive OTA.
  power_save_mode: none            # USB powered, we want quick alerts
  fast_connect: true               # skip the scan, matters on every battery wake
  on_connect:
    - script.execute:
        id: load_current_page
        bust_cache: !lambda "return id(bust_cache_on_boot);"
        force_display: false
    - lambda: "id(bust_cache_on_boot) = false;"
    - script.execute: report_telemetry
  ap:
    ssid: "reTerminal-E1002 Setup"
    password: !secret ap_password

captive_portal:

# Shares the logger's UART0 (the CH340 port on this board). Must never
# move to native USB (USB_SERIAL_JTAG/USB_CDC): those pins are GPIO19/20,
# which are the I2C bus for the SHT4x and the RTC.
improv_serial:

# So a home without Home Assistant can still set the hub URL and key from
# a browser at http://<device-ip>/ (POST /text/<id>/set?value=...). The
# captive portal above already pulls in the web server base.
# ota: false keeps firmware updates on the esphome OTA platform above,
# which is password protected, instead of the web UI's own OTA upload.
web_server:
  version: 3
  auth:
    type: basic     # explicit: ESPHome 2027.1.0 changes the unset default to digest
    username: !secret web_username
    password: !secret web_password
  ota: false

# hub_base_url and hub_key: runtime text components, restored from NVS
# after the first boot. initial_value seeds them from secrets.yaml only on
# that first boot; afterwards edit them at http://<device-ip>/ above or as
# Home Assistant text entities. mode: password keeps the key masked on the
# web page. max_length 255 is the text platform's hard cap.
text:
  - platform: template
    id: hub_base_url
    name: "Hub base URL"
    mode: text
    restore_value: true
    optimistic: true
    max_length: 255
    initial_value: !secret hub_base_url
  - platform: template
    id: hub_key
    name: "Hub key"
    mode: password
    restore_value: true
    optimistic: true
    max_length: 255
    initial_value: !secret hub_key

# Battery mode only. No run_duration or sleep_duration here: the device sleeps
# only when the go_to_sleep script says so, and wakes on the timer or on any of
# the three buttons (active low, ext1 ANY_LOW). The per-pin on_wake triggers
# run before on_boot, so they can move page_index before the page is fetched.
deep_sleep:
  id: sleeper
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - pin:
          number: GPIO5
          allow_other_uses: true
        on_wake:
          - lambda: |-
              id(wake_pin) = 5;
              id(wake_cause) = "button_left";
              int count = id(page_count);
              id(page_index) = ((id(page_index) - 1) % count + count) % count;
      - pin:
          number: GPIO4
          allow_other_uses: true
        on_wake:
          - lambda: |-
              id(wake_pin) = 4;
              id(wake_cause) = "button_right";
              id(page_index) = (id(page_index) + 1) % id(page_count);
      - pin:
          number: GPIO3
          allow_other_uses: true
        on_wake:
          - lambda: |-
              id(wake_pin) = 3;
              id(wake_cause) = "button_green";
              id(bust_cache_on_boot) = true;
  on_wake:
    - lambda: |-
        // Per-pin triggers above already named the button; only fill in the rest.
        if (id(wake_cause) == "power_on") {
          if (cause == deep_sleep::WAKEUP_CAUSE_TIMER) id(wake_cause) = "timer";
          else if (cause == deep_sleep::WAKEUP_CAUSE_GPIO) id(wake_cause) = "button_unknown";
          else id(wake_cause) = "other";
        }
        ESP_LOGI("main", "Woke from deep sleep: %s (cause=%d)", id(wake_cause).c_str(), (int) cause);

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Bangkok
    on_time_sync:
      - pcf85063.write_time:
          id: rtc_time
  - platform: pcf85063
    id: rtc_time
    i2c_id: main_bus
    address: 0x51
    timezone: Asia/Bangkok
    # Read once at boot (on_boot above). Polling would overwrite the SNTP
    # epoch with the drifting RTC value every 15 minutes.
    update_interval: never

globals:
  - id: battery_mode
    type: bool
    restore_value: true
    initial_value: "false"
  - id: bust_cache_on_boot
    type: bool
    restore_value: false
    initial_value: "false"
  - id: next_sleep_seconds
    type: uint32_t
    restore_value: false
    initial_value: "3600"
  - id: wake_pin
    type: int
    restore_value: false
    initial_value: "-1"
  - id: wake_cause
    type: std::string
    restore_value: false
    initial_value: '"power_on"'
  # Auto power mode: follow USB presence reported by the charger chip.
  - id: power_auto
    type: bool
    restore_value: true
    initial_value: "true"
  - id: usb_present
    type: bool
    restore_value: false
    initial_value: "true"
  - id: charger_status
    type: int
    restore_value: false
    initial_value: "-1"
  - id: current_url
    type: std::string
    restore_value: false
  # Runtime page state, replacing what used to be the compile-time
  # page_count substitution and a hard-coded PAGES[] name list: the device
  # learns both from every telemetry response (docs/ARCHITECTURE.md,
  # "Device (ESPHome)"). page_count defaults to 5 and survives a reboot;
  # page_names does not, since a fresh session has not yet been told the
  # ids and should say so rather than show a stale name.
  - id: page_count
    type: int
    restore_value: true
    initial_value: "5"
  - id: page_names
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: page_index
    type: int
    restore_value: true
    initial_value: "0"
  - id: saved_page_index
    type: int
    restore_value: false
    initial_value: "0"
  - id: alert_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: force_display_update
    type: bool
    restore_value: false
    initial_value: "false"

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

i2c:
  - id: main_bus
    sda: GPIO19
    scl: GPIO20
  # Schematic labels GPIO39/40 as I2C1; the SY6974B charger is probed on both
  # buses at address 0x6B and the one that answers is used.
  - id: charger_bus
    sda: GPIO39
    scl: GPIO40

http_request:
  timeout: 20s
  watchdog_timeout: 30s

image:
  - platform: online_image
    id: dashboard_image
    # online_image's url: is evaluated at compile time, not templatable,
    # so this is a harmless placeholder that is never actually fetched:
    # load_current_page's set_url() always runs on the very first call,
    # since current_url (below) starts empty and so always differs.
    url: "http://localhost/placeholder.png"
    request_headers:
      Authorization: !lambda 'return std::string("Bearer ") + id(hub_key).state;'
    format: PNG
    type: RGB565
    buffer_size: 65536
    update_interval: never
    on_download_finished:
      - if:
          condition:
            lambda: "return !cached || id(force_display_update);"
          then:
            - lambda: "id(force_display_update) = false;"
            - logger.log:
                level: INFO
                format: "Image changed, queueing panel refresh"
            - script.execute: refresh_panel
          else:
            - logger.log:
                level: INFO
                format: "Image unchanged (304), panel refresh skipped"
            - script.execute: report_telemetry
            - if:
                condition:
                  lambda: "return id(battery_mode);"
                then:
                  - script.execute: sleep_timer
    on_error:
      - lambda: "id(force_display_update) = false;"
      - logger.log:
          level: WARN
          format: "Image download failed, keeping current screen"
      - rtttl.stop
      - rtttl.play: "err:d=8,o=4,b=140:c"
      - if:
          condition:
            lambda: "return id(battery_mode);"
          then:
            - script.execute: sleep_timer

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      it.image(0, 0, id(dashboard_image));

script:
  # The epaper_spi driver drops update() unless its state machine is IDLE,
  # and a full Spectra 6 cycle (refresh, power off, deep sleep) takes 30 to
  # 40 s. Component::is_idle() is true exactly when that machine is IDLE
  # (the driver disables its loop in IDLE and re-enables it on update), so
  # wait for it instead of losing the refresh. mode: restart means a newer
  # image simply replaces a still-queued refresh.
  - id: refresh_panel
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: "return id(epaper_display)->is_idle();"
          timeout: 120s
      - logger.log:
          level: INFO
          format: "Panel idle, refreshing"
      - component.update: epaper_display
      - if:
          condition:
            lambda: "return id(battery_mode);"
          then:
            - delay: 500ms
            - wait_until:
                condition:
                  lambda: "return id(epaper_display)->is_idle();"
                timeout: 120s
            - script.execute: report_telemetry
            - script.execute: sleep_timer

  # Push onboard sensor readings to the hub. The hub stores them and draws
  # the desk panel and the 24 h climate chart; the device keeps no history.
  - id: report_telemetry
    mode: single
    then:
      - if:
          condition:
            wifi.connected:
          then:
            # Same guard as load_current_page: the POST blocks the loop.
            - wait_until:
                condition:
                  not:
                    rtttl.is_playing:
                timeout: 500ms
            - rtttl.stop
            - http_request.post:
                url: !lambda 'return id(hub_base_url).state + "/api/device/telemetry";'
                request_headers:
                  Content-Type: application/json
                  # http_request.post's request_headers values compile as
                  # const char* (unlike online_image's, which take
                  # std::string), so the built value needs storage that
                  # outlives the lambda: a static buffer, not a temporary.
                  Authorization: !lambda |-
                    static std::string auth;
                    auth = std::string("Bearer ") + id(hub_key).state;
                    return auth.c_str();
                body: !lambda |-
                  auto num = [](float v, int decimals) -> std::string {
                    if (std::isnan(v)) return "null";
                    char b[24];
                    snprintf(b, sizeof(b), "%.*f", decimals, v);
                    return b;
                  };
                  int count = id(page_count);
                  int idx = id(page_index);
                  if (idx < 0 || idx >= count) idx = 0;
                  std::string page_id = deskmate::page_name(id(page_names), idx);
                  std::string body = "{";
                  body += "\"device\":\"${name}\"";
                  body += ",\"battery_voltage\":" + num(id(battery_voltage).state, 3);
                  body += ",\"battery_level\":" + num(id(battery_level).state, 1);
                  body += ",\"temperature\":" + num(id(temp_sensor).state, 2);
                  body += ",\"humidity\":" + num(id(hum_sensor).state, 1);
                  body += ",\"wifi_rssi\":" + num(id(wifi_rssi).state, 0);
                  body += ",\"uptime_s\":" + num(id(uptime_s).state, 0);
                  // page: the resolved id when known, "alert" while an alert
                  // is showing (page_index below still names the page
                  // underneath), or null when this session has not yet been
                  // told the id for this index; the hub resolves that case.
                  if (id(alert_active)) {
                    body += ",\"page\":\"alert\"";
                  } else if (!page_id.empty()) {
                    body += ",\"page\":\"" + page_id + "\"";
                  } else {
                    body += ",\"page\":null";
                  }
                  body += ",\"page_index\":" + std::to_string(idx);
                  body += std::string(",\"battery_mode\":") + (id(battery_mode) ? "true" : "false");
                  body += std::string(",\"usb_present\":") + (id(usb_present) ? "true" : "false");
                  body += std::string(",\"charge_state\":\"") + deskmate::charge_state_name(id(charger_status)) + "\"";
                  body += std::string(",\"wake_cause\":\"") + id(wake_cause) + "\"";
                  body += "}";
                  return body;
                capture_response: true
                on_response:
                  - if:
                      condition:
                        lambda: "return !http_request::is_success(response->status_code);"
                      then:
                        - logger.log:
                            level: WARN
                            format: "Telemetry rejected by hub, HTTP %d: set the Hub key on the device's web page or in Home Assistant"
                            args: [response->status_code]
                      else:
                        # Learn the page count and ids for this session. The
                        # loop is already blocked for the duration of the
                        # POST, so keep this short.
                        - lambda: |-
                            json::parse_json(body, [](JsonObject root) -> bool {
                              if (root["page_count"].is<int>()) {
                                int n = root["page_count"].as<int>();
                                if (n >= 1 && n <= 32) id(page_count) = n;
                              }
                              if (root["pages"].is<JsonArray>()) {
                                JsonArray pages = root["pages"].as<JsonArray>();
                                std::string joined;
                                for (JsonVariant v : pages) {
                                  if (!v.is<std::string>()) continue;
                                  if (!joined.empty()) joined += ",";
                                  joined += v.as<std::string>();
                                }
                                id(page_names) = joined;
                              }
                              return true;
                            });
                            int count = id(page_count);
                            id(page_index) = ((id(page_index) % count) + count) % count;
                on_error:
                  - logger.log:
                      level: WARN
                      format: "Telemetry POST failed"

  # Read the charger status register and, in auto mode, follow USB presence.
  - id: check_power
    mode: single
    then:
      - lambda: |-
          static deskmate::ChargerProbe probe_i2c1(id(charger_bus));
          static deskmate::ChargerProbe probe_i2c0(id(main_bus));
          int status = probe_i2c1.read_status();
          if (status < 0) status = probe_i2c0.read_status();
          bool usb = deskmate::usb_present(status);
          if (status < 0) {
            if (id(charger_status) != status)
              ESP_LOGW("main", "Charger not answering on either I2C bus, assuming USB present");
            usb = true;
          } else if (status != id(charger_status) || usb != id(usb_present)) {
            ESP_LOGI("main", "Charger status 0x%02x: USB %s, %s", status, usb ? "present" : "absent",
                     deskmate::charge_state_name(status));
          }
          id(charger_status) = status;
          id(usb_present) = usb;
      - if:
          condition:
            lambda: "return id(power_auto) && !id(usb_present) && !id(battery_mode);"
          then:
            - logger.log:
                level: INFO
                format: "USB unplugged, switching to battery mode"
            - script.execute:
                id: set_battery_mode
                enabled: true
      - if:
          condition:
            lambda: "return id(power_auto) && id(usb_present) && id(battery_mode);"
          then:
            - logger.log:
                level: INFO
                format: "USB present, switching to always-on mode"
            - script.execute:
                id: set_battery_mode
                enabled: false

  - id: set_battery_mode
    mode: restart
    parameters:
      enabled: bool
    then:
      - lambda: "id(battery_mode) = enabled;"
      - rtttl.stop
      - if:
          condition:
            lambda: "return enabled;"
          then:
            - logger.log:
                level: INFO
                format: "Battery mode ON"
            - rtttl.play: "bat_on:d=16,o=6,b=200:g,e,c"
            - script.execute: sleep_timer
          else:
            - logger.log:
                level: INFO
                format: "Battery mode OFF"
            - rtttl.play: "bat_off:d=16,o=6,b=200:c,e,g"
            - script.stop: sleep_timer
            - script.stop: battery_deadline

  # Battery mode. sleep_timer gives the user a grace window to press more
  # buttons; battery_deadline is the safety net if Wi-Fi or the download
  # never completes. go_to_sleep computes the time to the next slot.
  - id: sleep_timer
    mode: restart
    then:
      - delay: ${battery_awake_grace}
      - script.execute: go_to_sleep

  - id: battery_deadline
    mode: single
    then:
      - delay: 25s
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - logger.log:
                level: WARN
                format: "Battery mode: no Wi-Fi, sleeping early"
            - script.execute: go_to_sleep
      - delay: ${battery_awake_deadline}
      - logger.log:
          level: WARN
          format: "Battery mode: deadline reached, sleeping"
      - script.execute: go_to_sleep

  - id: go_to_sleep
    mode: single
    then:
      - if:
          condition:
            lambda: "return !id(battery_mode);"
          then:
            - logger.log: "Battery mode off, staying awake"
          else:
            # never cut a Spectra 6 cycle in half: the panel would stay powered
            - wait_until:
                condition:
                  lambda: "return id(epaper_display)->is_idle();"
                timeout: 60s
            - lambda: |-
                auto now = id(sntp_time).now();
                uint32_t secs = 3600;
                if (now.is_valid()) {
                  int sod = now.hour * 3600 + now.minute * 60 + now.second;
                  secs = deskmate::seconds_until_next_slot(sod, {${wake_hours}});
                }
                ESP_LOGI("main", "Battery mode: sleeping for %u s (time valid=%d)", (unsigned) secs, (int) now.is_valid());
                id(next_sleep_seconds) = secs;
                deskmate::prepare_sleep_pads();
            - deep_sleep.enter:
                id: sleeper
                sleep_duration: !lambda "return id(next_sleep_seconds) * 1000;"

  # Request the PNG for the current page. bust_cache adds a query string so
  # the hub re-renders instead of serving its cache. force_display makes the
  # panel refresh even when the hub answers 304.
  - id: load_current_page
    mode: restart
    parameters:
      bust_cache: bool
      force_display: bool
    then:
      # Any page load counts as activity for the battery grace window.
      - if:
          condition:
            lambda: "return id(battery_mode);"
          then:
            - script.execute: sleep_timer
      # A second press must not be swallowed by an in-flight download:
      # OnlineImage::update() silently returns while decoding.
      - if:
          condition:
            lambda: "return id(dashboard_image)->is_decoding();"
          then:
            - online_image.release: dashboard_image
      - lambda: |-
          id(force_display_update) = force_display;
          int count = id(page_count);
          int idx = id(page_index);
          if (idx < 0 || idx >= count) idx = 0;
          std::string url = id(hub_base_url).state + "/display/" + std::to_string(idx) + ".png";
          if (bust_cache) url += "?t=" + std::to_string(millis());
          // set_url() unconditionally clears the ETag, so only call it when the
          // URL really changed. Same URL keeps the ETag and lets the hub answer 304.
          // current_url starts empty (see globals below), so this always
          // differs on the very first call and set_url() always runs then.
          if (url != id(current_url)) {
            id(current_url) = url;
            id(dashboard_image)->set_url(url);
          }
      # The HTTP connect inside update() blocks the main loop, and the rtttl
      # component only advances notes from loop(). A click tone still
      # sounding here stayed on for the whole connect (20 s when the hub was
      # down) and read as a stuck buzzer. Let the tone finish, then silence
      # the output before the blocking call.
      - wait_until:
          condition:
            not:
              rtttl.is_playing:
          timeout: 500ms
      - rtttl.stop
      - component.update: dashboard_image

  - id: goto_page
    mode: restart
    parameters:
      page: int
      bust_cache: bool
    then:
      - lambda: |-
          int count = id(page_count);
          id(page_index) = ((page % count) + count) % count;
      - script.execute:
          id: load_current_page
          bust_cache: !lambda "return bust_cache;"
          force_display: true

  # Full-screen alert: beep, show /display/alert.png, restore previous page
  # after `duration` seconds (0 means the default).
  # Ignored in battery mode: the device is asleep for hours at a time, so an
  # alert that happened to land in the short awake window would stay on the
  # panel until the next scheduled wake. Home Assistant automations should
  # check the "Power mode" sensor before calling it (docs/DATA-SOURCES.md).
  - id: show_alert
    mode: restart
    parameters:
      duration: int
      beep: bool
    then:
      - if:
          condition:
            lambda: "return id(battery_mode);"
          then:
            - logger.log:
                level: WARN
                format: "Alert ignored: battery mode, the device would sleep with the alert on screen"
            - script.stop: show_alert
      - lambda: |-
          if (!id(alert_active)) {
            id(saved_page_index) = id(page_index);
            id(alert_active) = true;
          }
          id(force_display_update) = true;
      - if:
          condition:
            lambda: "return beep;"
          then:
            - rtttl.stop
            - rtttl.play: "alert:d=8,o=6,b=180:e,p,e,p,e"
      - if:
          condition:
            lambda: "return id(dashboard_image)->is_decoding();"
          then:
            - online_image.release: dashboard_image
      - lambda: |-
          id(current_url) = id(hub_base_url).state + "/display/alert.png?t=" + std::to_string(millis());
          id(dashboard_image)->set_url(id(current_url));
      # Let the alert tone finish before the blocking connect (see
      # load_current_page); the tone is about 1.6 s long.
      - wait_until:
          condition:
            not:
              rtttl.is_playing:
          timeout: 2500ms
      - rtttl.stop
      - component.update: dashboard_image
      - delay: !lambda "return (duration > 0 ? duration : ${alert_default_seconds}) * 1000;"
      - lambda: |-
          id(alert_active) = false;
          id(page_index) = id(saved_page_index);
      - script.execute:
          id: load_current_page
          bust_cache: false
          force_display: true

interval:
  - interval: 10s
    then:
      - script.execute: check_power
  - interval: ${telemetry_interval}
    then:
      - script.execute: report_telemetry
  - interval: ${auto_refresh_interval}
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: "return !id(alert_active);"
          then:
            - script.execute:
                id: load_current_page
                bust_cache: false
                force_display: false

binary_sensor:
  - platform: gpio
    id: button_left
    name: "Left button"
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    filters:
      # The tact switches open briefly (under 100 ms) shortly after a press,
      # which made the release-edge click triggers fire while still held.
      - delayed_on: 50ms
      - delayed_off: 250ms
    on_press:
      - lambda: "id(wake_pin) = -1;"     # a real press: later clicks are genuine
    on_click:
      - min_length: 30ms
        max_length: 800ms
        then:
          - if:
              condition:
                lambda: "return !deskmate::consume_wake_click(id(wake_pin), 5) && !id(alert_active);"
              then:
                - script.execute:
                    id: goto_page
                    page: !lambda "return id(page_index) - 1;"
                    bust_cache: false
      # long press: toggle battery mode (and pin it: auto mode off)
      - min_length: 801ms
        max_length: 60s
        then:
          - if:
              condition:
                lambda: "return !deskmate::consume_wake_click(id(wake_pin), 5);"
              then:
                - lambda: "id(power_auto) = false;"
                - script.execute:
                    id: set_battery_mode
                    enabled: !lambda "return !id(battery_mode);"

  - platform: gpio
    id: button_right
    name: "Right button"
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    filters:
      # The tact switches open briefly (under 100 ms) shortly after a press,
      # which made the release-edge click triggers fire while still held.
      - delayed_on: 50ms
      - delayed_off: 250ms
    on_press:
      - lambda: "id(wake_pin) = -1;"
      - if:
          condition:
            lambda: "return !id(alert_active);"
          then:
            - script.execute:
                id: goto_page
                page: !lambda "return id(page_index) + 1;"
                bust_cache: false

  - platform: gpio
    id: button_green
    name: "Green button"
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    filters:
      # The tact switches open briefly (under 100 ms) shortly after a press,
      # which made the release-edge click triggers fire while still held.
      - delayed_on: 50ms
      - delayed_off: 250ms
    on_press:
      - lambda: "id(wake_pin) = -1;"
    on_click:
      # short press: refresh current page with a fresh render
      # Filters shift the measured length by about +200 ms; ranges stay
      # contiguous so no press length is a dead zone.
      - min_length: 30ms
        max_length: 800ms
        then:
          - if:
              condition:
                lambda: "return !deskmate::consume_wake_click(id(wake_pin), 3);"
              then:
                - rtttl.stop
                - rtttl.play: "click:d=32,o=6,b=200:c"
                - if:
                    condition:
                      lambda: "return id(alert_active);"
                    then:
                      # dismiss the alert early
                      - script.stop: show_alert
                      - lambda: |-
                          id(alert_active) = false;
                          id(page_index) = id(saved_page_index);
                      - script.execute:
                          id: load_current_page
                          bust_cache: false
                          force_display: true
                    else:
                      - script.execute:
                          id: load_current_page
                          bust_cache: true
                          force_display: true
      # long press: back to Today
      - min_length: 801ms
        max_length: 60s
        then:
          - if:
              condition:
                lambda: "return !deskmate::consume_wake_click(id(wake_pin), 3);"
              then:
                - rtttl.stop
                - rtttl.play: "home:d=16,o=6,b=200:c,e"
                - script.stop: show_alert
                - lambda: "id(alert_active) = false;"
                - script.execute:
                    id: goto_page
                    page: 0
                    bust_cache: true

  - platform: template
    id: usb_power
    name: "USB power"
    device_class: plug
    lambda: "return id(usb_present);"

output:
  - platform: ledc
    id: buzzer_output
    pin: GPIO45
    frequency: 1000Hz
  - platform: gpio
    id: bsp_led
    pin: GPIO6
    inverted: true
  - platform: gpio
    id: bsp_battery_enable
    pin: GPIO21

rtttl:
  id: buzzer
  output: buzzer_output
  # Lowered from 60% on 2026-09-05: the owner found a stuck note at 60%
  # painful. Tones are feedback, not alarms; the alert page has the screen.
  gain: 30%

light:
  - platform: binary
    id: onboard_led
    name: "Onboard LED"
    output: bsp_led

sensor:
  - platform: sht4x
    i2c_id: main_bus
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Humidity"
      id: hum_sensor
    update_interval: 60s
  - platform: adc
    id: battery_voltage
    name: "Battery voltage"
    pin: GPIO1
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0
  - platform: copy
    source_id: battery_voltage
    id: battery_level
    name: "Battery level"
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi signal"
    update_interval: 60s
  - platform: uptime
    id: uptime_s
    name: "Uptime"

text_sensor:
  - platform: template
    id: charge_state
    name: "Charge state"
    icon: "mdi:battery-charging"
    lambda: "return std::string(deskmate::charge_state_name(id(charger_status)));"
    update_interval: 60s
  - platform: template
    id: last_wake_cause
    name: "Last wake cause"
    icon: "mdi:sleep-off"
    lambda: "return id(wake_cause);"
    update_interval: 60s
  - platform: template
    id: power_mode
    name: "Power mode"
    icon: "mdi:power-plug"
    lambda: |-
      std::string mode = id(battery_mode) ? "battery" : "always_on";
      if (id(power_auto)) mode += " (auto)";
      return mode;
    update_interval: 60s
  - platform: template
    id: current_page
    name: "Current page"
    lambda: |-
      if (id(alert_active)) return std::string("alert");
      int count = id(page_count);
      int idx = id(page_index);
      if (idx < 0 || idx >= count) idx = 0;
      std::string page_id = deskmate::page_name(id(page_names), idx);
      if (!page_id.empty()) return page_id;
      return std::string("page ") + std::to_string(idx);
    update_interval: 60s

switch:
  - platform: template
    id: power_auto_switch
    restore_mode: DISABLED   # the globals are the state; default ALWAYS_OFF would run turn_off at boot
    name: "Auto power mode"
    icon: "mdi:power-settings"
    lambda: "return id(power_auto);"
    turn_on_action:
      - lambda: "id(power_auto) = true;"
      - script.execute: check_power
    turn_off_action:
      - lambda: "id(power_auto) = false;"
  - platform: template
    id: battery_mode_switch
    restore_mode: DISABLED   # the globals are the state; default ALWAYS_OFF would run turn_off at boot
    name: "Battery mode"
    icon: "mdi:battery-clock"
    lambda: "return id(battery_mode);"
    turn_on_action:
      - script.execute:
          id: set_battery_mode
          enabled: true
    turn_off_action:
      - script.execute:
          id: set_battery_mode
          enabled: false

button:
  - platform: restart
    name: "Restart"
