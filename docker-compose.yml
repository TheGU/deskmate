services:
  dashboard-hub:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: deskmate/dashboard-hub:latest
    container_name: deskmate-dashboard-hub
    restart: unless-stopped
    # uvicorn is not a process reaper; init gives Chromium's children a pid 1
    # that is, so a crashed browser leaves no zombies behind.
    init: true
    # Measured ~236 MiB after rendering every page (Chromium at 4x), slim
    # image. A runaway renderer is OOM-killed at this ceiling and restart
    # brings the hub back, instead of taking the host down with it.
    mem_limit: 1g
    # The container runs as this uid:gid and writes ./data as it. The
    # default matches the image's own hub user. Set PUID/PGID in .env to the
    # owner of ./data (`id -u`, `id -g`) when that differs.
    user: "${PUID:-1001}:${PGID:-1001}"
    ports:
      # Container listens on 8080 as a non-root user. Host port defaults to
      # 80; set HUB_PORT when 80 is taken or needs no privileges.
      - "${HUB_PORT:-80}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      # The hub's one database (data/deskmate.sqlite: identity, settings,
      # pushed datasets, telemetry), read-write.
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200 else 1)"
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      # The hub logs every request and telemetry sample; on a box meant to run
      # for a year, an unbounded json-file log only grows, so cap and rotate it.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
