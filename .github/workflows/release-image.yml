name: Publish release image

on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

jobs:
  ci:
    if: >-
      github.event_name == 'push' ||
      (contains(github.event.pull_request.labels.*.name, 'run-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'run-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify release image
        env:
          CI_REVISION: ${{ github.sha }}
        run: sh scripts/check-release.sh
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and publish to GHCR
        env:
          FORGE_SERVER_URL: ${{ github.server_url }}
          FORGE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
          CONTAINER_REGISTRY: ghcr.io
          CONTAINER_IMAGE: ${{ vars.CONTAINER_IMAGE }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-image.py
