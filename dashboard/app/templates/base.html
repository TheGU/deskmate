<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>deskmate {{ page_title }}</title>
<style>
{{ font_css|safe }}

/* --- reset ------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 800px; height: 480px;
  background: #FFFFFF; color: #000000;
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  -webkit-font-smoothing: none;
  text-rendering: geometricPrecision;
  overflow: hidden;
}

/* --- palette ---------------------------------------------------------- */
/* Only the six panel colors. No grays, no gradients, no shadows. */
.t-red   { color: #FF0000; }
.t-blue  { color: #0000FF; }
.t-black { color: #000000; }

.chip {
  display: inline-block;
  border: 3px solid #000000;
  padding: 1px 8px 3px 8px;
  font-weight: 900;
  font-size: 17px;
  line-height: 1.1;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.chip-black  { background: #FFFFFF; color: #000000; }
.chip-red    { background: #FF0000; color: #FFFFFF; }
.chip-yellow { background: #FFFF00; color: #000000; }
.chip-green  { background: #00FF00; color: #000000; }
.chip-blue   { background: #0000FF; color: #FFFFFF; }

.bar-red    { background: #FF0000; }
.bar-yellow { background: #FFFF00; }
.bar-green  { background: #00FF00; }
.bar-blue   { background: #0000FF; }
.bar-black  { background: #000000; }

/* --- frame ------------------------------------------------------------ */
.screen { width: 800px; height: 480px; display: flex; flex-direction: column; }

.hdr {
  height: 68px; flex: 0 0 68px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px;
  border-bottom: 4px solid #000000;
}
.hdr-date { font-size: 30px; font-weight: 900; letter-spacing: 0.02em; }
.hdr-title {
  font-size: 30px; font-weight: 900; letter-spacing: 0.10em;
  border-bottom: 6px solid #000000; padding-bottom: 2px;
}
.hdr-right { font-size: 26px; font-weight: 700; text-align: right; letter-spacing: 0.02em; }
.hdr-right .big { font-size: 32px; font-weight: 900; }
.hdr-right .sub { font-size: 19px; font-weight: 700; letter-spacing: 0.06em; }

.body { flex: 1 1 auto; display: flex; min-height: 0; }

.footer {
  flex: 0 0 58px; height: 58px;
  border-top: 4px solid #000000;
  display: flex; align-items: center; gap: 14px;
  padding: 0 22px;
  overflow: hidden;
}
.footer-text {
  font-size: 19px; font-weight: 700; line-height: 1.2;
  flex: 1 1 auto;
  max-height: 46px;
  overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.footer-updated {
  font-size: 18px; font-weight: 700; letter-spacing: 0.06em; white-space: nowrap;
}

/* --- shared blocks ---------------------------------------------------- */
.section-title {
  font-size: 19px; font-weight: 900; letter-spacing: 0.12em;
  padding-bottom: 4px; border-bottom: 3px solid #000000;
  margin-bottom: 9px;
}
.rule { height: 3px; background: #000000; margin: 10px 0; }
.rule-thick { height: 4px; background: #000000; }

.row { display: flex; align-items: baseline; gap: 10px; }
.muted-note {
  font-size: 18px; font-weight: 700; letter-spacing: 0.04em;
}
.empty {
  font-size: 20px; font-weight: 700; letter-spacing: 0.04em;
}
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
{% block style %}{% endblock %}
</style>
</head>
<body>
<div class="screen">
{% block screen %}
  <header class="hdr">
    <div class="hdr-date">{{ date_label }}</div>
    <div class="hdr-title">{{ page_title }}</div>
    <div class="hdr-right">{% block header_right %}{% endblock %}</div>
  </header>
  <main class="body">{% block content %}{% endblock %}</main>
  {% block footer %}{% endblock %}
{% endblock %}
</div>
</body>
</html>
