<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deskmate preview</title>
<style>
  /* A developer tool, not a device page: same fonts and the same black on
     white, but it may scroll and it may be wider than 800 px. */
  @font-face {
    font-family: 'Google Sans'; font-style: normal; font-weight: 400 700;
    font-display: block;
    src: url('/static/fonts/GoogleSans-LatinThai-var.ttf') format('truetype');
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: #FFFFFF; color: #000000;
    font-family: 'Google Sans', sans-serif;
    font-weight: 600;
  }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.08em; margin: 0 0 6px 0; }
  p.sub { margin: 0 0 18px 0; font-size: 15px; font-weight: 600; }
  nav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  nav a, nav button {
    display: inline-block; border: 3px solid #000000; background: #FFFFFF; color: #000000;
    padding: 6px 12px; font: inherit; font-weight: 700; text-decoration: none;
    letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
  }
  nav a.active, nav button.active { background: #000000; color: #FFFFFF; }
  .pane { flex: 0 0 auto; }
  .frame { border: 4px solid #000000; }
  /* Never resampled by the browser: the simulated panel image is shown at
     one device pixel per panel pixel, so what you judge is what the panel
     draws. The raw HTML iframe stays at 800x480 CSS px, unscaled. */
  img.frame { display: block; image-rendering: pixelated; }
  iframe.frame { width: 800px; height: 480px; background: #FFFFFF; }
  .meta { font-size: 14px; font-weight: 600; margin-top: 8px; max-width: 800px; }
  code { border: 2px solid #000000; padding: 0 4px; font-family: inherit; font-weight: 700; }
</style>
</head>
<body>
  <h1>deskmate preview</h1>
  <p class="sub">Page <strong>{{ page }}</strong>.</p>
  <nav>
    {% for name in pages %}
    <a class="{{ 'active' if name == page else '' }}" href="/preview?page={{ name }}">{{ name }}</a>
    {% endfor %}
    <button onclick="location.href='/preview?page={{ page }}&amp;t=' + Date.now()">Refresh</button>
  </nav>
  <nav>
    <button id="view-toggle" onclick="toggleView()">Simulated panel</button>
  </nav>
  <div class="pane">
    <img class="frame" id="panel" src="/display/{{ page }}.png?t={{ cache_bust }}" width="800" height="480" alt="{{ page }} page, six-ink panel simulation" style="display: none;">
    <iframe class="frame" id="raw" src="/preview/{{ page }}.html?t={{ cache_bust }}" title="{{ page }} html"></iframe>
    <div class="meta" id="scale-note">Updated {{ updated_label }}, timezone {{ timezone }}.</div>
    <div class="meta">
      {% for name, status in adapters.items() %}<code>{{ name }}={{ status }}</code> {% endfor %}
    </div>
  </div>
  <script>
    // A high-DPI monitor upscales an 800 px image and blurs it, which reads as
    // pixelation that the panel does not actually have. Divide by the device
    // pixel ratio so one panel pixel lands on exactly one device pixel. Only
    // the image needs this: the iframe is CSS px and stays at 800x480.
    function sizePanelImage() {
      var ratio = window.devicePixelRatio || 1;
      var image = document.getElementById('panel');
      image.style.width = (800 / ratio) + 'px';
      image.style.height = (480 / ratio) + 'px';
    }

    function applyView(showPanel) {
      document.getElementById('panel').style.display = showPanel ? 'block' : 'none';
      document.getElementById('raw').style.display = showPanel ? 'none' : 'block';
      document.getElementById('view-toggle').textContent = showPanel ? 'Raw HTML' : 'Simulated panel';
      document.getElementById('view-toggle').className = showPanel ? 'active' : '';
    }

    function toggleView() {
      var showPanel = document.getElementById('panel').style.display === 'none';
      try { localStorage.setItem('deskmate-preview-view', showPanel ? 'panel' : 'html'); } catch (e) {}
      applyView(showPanel);
    }

    sizePanelImage();
    var initial = 'html';
    try { initial = localStorage.getItem('deskmate-preview-view') || 'html'; } catch (e) {}
    applyView(initial === 'panel');
  </script>
</body>
</html>
