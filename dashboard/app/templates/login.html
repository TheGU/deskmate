<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deskmate sign in</title>
<style>
  /* Same visual language as setup.html: a developer/owner tool, viewed in
     a browser, not a panel page. */
  @font-face {
    font-family: 'Google Sans'; font-style: normal; font-weight: 400 700;
    font-display: block;
    src: url('/static/fonts/GoogleSans-LatinThai-var.ttf') format('truetype');
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: #FFFFFF; color: #000000;
    font-family: 'Google Sans', sans-serif; font-weight: 600;
    max-width: 560px;
  }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.08em; margin: 0 0 6px 0; }
  p.sub { margin: 0 0 18px 0; font-size: 15px; font-weight: 600; }
  label {
    display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; margin: 16px 0 4px;
  }
  input {
    width: 100%; border: 3px solid #000000; padding: 8px 10px; font: inherit;
    font-weight: 600; background: #FFFFFF; color: #000000;
  }
  button {
    margin-top: 22px; border: 3px solid #000000; background: #000000; color: #FFFFFF;
    padding: 10px 16px; font: inherit; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; cursor: pointer;
  }
  .hint { font-size: 13px; font-weight: 600; margin-top: 4px; }
  .error {
    border: 3px solid #FF0000; padding: 10px 12px; margin: 16px 0; font-weight: 700;
  }
</style>
</head>
<body>
  <h1>deskmate sign in</h1>
  <p class="sub">
    Enter the bearer token or the device key shown once on the setup page.
  </p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="key">Key</label>
    <input id="key" name="key" type="password" autocomplete="off" autofocus>
    <p class="hint">The device key from setup, or an agent's bearer token.</p>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
